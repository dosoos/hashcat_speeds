<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>Hashcat GPU Benchmark Data Visualization</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- DaisyUI & Tailwind -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.10.2/dist/full.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Chart.js datalabels plugin -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  <!-- Cloudflare Turnstile. Rendered explicitly when the submit modal opens. -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
</head>
<body class="bg-base-200 min-h-screen">
  <div class="container mx-auto p-4">
    <div class="flex flex-wrap items-center justify-between gap-3 mb-8">
      <h1 class="text-3xl font-bold text-center flex-1">Hashcat GPU Benchmark Data Visualization</h1>
      <button id="openSubmitBtn" class="btn btn-primary">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" /></svg>
        Submit Benchmark
      </button>
    </div>

    <!-- Submit benchmark modal -->
    <dialog id="submitModal" class="modal">
      <div class="modal-box w-11/12 max-w-2xl">
        <form method="dialog">
          <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>
        </form>
        <h3 class="font-bold text-xl mb-2">Submit Benchmark</h3>
        <p class="text-sm text-base-content/70 mb-4">
          Paste the full output of <code class="badge badge-ghost">hashcat -b --benchmark-all</code>.
          GPU model is detected automatically.
        </p>

        <form id="submitForm" class="space-y-4">
          <div class="form-control w-full">
            <label class="label"><span class="label-text">Benchmark output</span></label>
            <textarea id="submitContent" required rows="12"
              class="textarea textarea-bordered w-full font-mono text-xs"
              placeholder="hashcat (v6.2.6) starting in benchmark mode...

* Device #1: NVIDIA GeForce RTX 4090, 20155/24563 MB, 128MCU
..."></textarea>
          </div>

          <div id="turnstileWidget"></div>

          <div id="submitStatus" role="alert" class="alert hidden"></div>

          <div class="modal-action">
            <button type="button" id="cancelSubmitBtn" class="btn">Cancel</button>
            <button type="submit" id="submitBtn" class="btn btn-primary">
              <span id="submitBtnLabel">Submit</span>
              <span id="submitBtnSpinner" class="loading loading-spinner loading-sm hidden"></span>
            </button>
          </div>
        </form>
      </div>
      <form method="dialog" class="modal-backdrop"><button>close</button></form>
    </dialog>

    <!-- Loading indicator -->
    <div id="loading" class="text-center">
      <div class="loading loading-spinner loading-lg"></div>
      <p class="mt-4" id="loading-text">Loading benchmark data...</p>
    </div>
    
    <!-- Main content -->
    <div id="main-content" class="hidden">
      <!-- Hash mode selector -->
      <div class="card bg-base-100 shadow-xl mb-6">
        <div class="card-body">
          <h2 class="card-title">Select Hash Mode</h2>
          <div class="form-control w-full">
            <label class="label">
              <span class="label-text">Search and choose a hash mode to visualize:</span>
            </label>
            <div class="relative">
              <input 
                type="text" 
                id="hashModeSearch" 
                placeholder="Search hash modes..." 
                class="input input-bordered w-full pr-16"
                autocomplete="off"
              />
              <button 
                type="button" 
                id="clearSearch" 
                class="btn btn-ghost btn-sm absolute right-0 top-0 h-full px-2"
                style="display: none;"
              >
                ✕
              </button>
            </div>
            <div id="hashModeDropdown" class="dropdown-content bg-base-100 rounded-box z-[1] w-full shadow-lg border border-base-300" style="display: none; max-height: 300px; overflow-y: auto;">
              <!-- Options will be populated here -->
            </div>
          </div>
        </div>
      </div>
      
      <!-- Chart container -->
      <div class="card bg-base-100 shadow-xl">
        <div class="card-body">
          <h2 class="card-title" id="chartTitle">GPU Performance Comparison</h2>
          <div class="w-full" id="chartContainer">
            <canvas id="performanceChart"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ---------------------------------------------------------------------------
    // Submission endpoint. Both values must be set or the submit button is hidden.
    //   workerUrl        – Cloudflare Worker URL (no trailing slash)
    //   turnstileSiteKey – Cloudflare Turnstile SITE key (public, starts with 0x)
    // ---------------------------------------------------------------------------
    const SUBMIT_CONFIG = {
      workerUrl: 'https://hashcat-speeds.dosoos.workers.dev',
      turnstileSiteKey: '0x4AAAAAAENwB3RC9AfYOAhr'
    };

    // Register Chart.js datalabels plugin
    Chart.register(ChartDataLabels);

    // Global variables
    let benchmarkData = {};
    let availableHashModes = [];
    let chart = null;
    let selectedHashMode = '';
    let filteredHashModes = [];
    
    // Shorten a device name (benchmark filename) for axis labels.
    // 1) drop trailing _<ISO timestamp> (e.g. _2026-08-12T08-39-58.435)
    // 2) if still over maxLen, drop vendor prefix (NVIDIA_GeForce_, TESLA_, ...)
    // 3) fall back to truncation with ellipsis, then turn underscores into spaces.
    function shortDeviceLabel(name, maxLen) {
      maxLen = maxLen || 20;
      var label = name.replace(/_\d{4}-\d{2}-\d{2}T[\d:.\-]+$/, '');
      if (label.length > maxLen) {
        label = label.replace(/^(NVIDIA_GeForce_|NVIDIA_|AMD_Radeon_|AMD_|Intel_|TESLA_)/, '');
      }
      if (label.length > maxLen) {
        label = label.slice(0, maxLen - 1) + '…';
      }
      return label.replace(/_/g, ' ');
    }

    // Function to format speed values
    function formatSpeed(speed) {
      if (speed >= 1e12) {
        return (speed / 1e12).toFixed(1) + ' TH/s';
      } else if (speed >= 1e9) {
        return (speed / 1e9).toFixed(1) + ' GH/s';
      } else if (speed >= 1e6) {
        return (speed / 1e6).toFixed(1) + ' MH/s';
      } else if (speed >= 1e3) {
        return (speed / 1e3).toFixed(1) + ' kH/s';
      } else {
        return speed.toFixed(1) + ' H/s';
      }
    }
    
    
    // Function to load all benchmark data from datas.json
    async function loadAllBenchmarkData() {
      const loadingElement = document.getElementById('loading');
      const mainContent = document.getElementById('main-content');
      
      try {
        console.log('Loading benchmark data from datas.json...');
        document.getElementById('loading-text').textContent = 'Loading benchmark data from datas.json...';
        
        const response = await fetch('datas.json');
        if (!response.ok) {
          throw new Error('Failed to load datas.json');
        }
        
        // Load the complete benchmark data directly
        benchmarkData = await response.json();
        
        // Collect all hash modes from all devices
        const allHashModes = new Set();
        Object.values(benchmarkData).forEach(deviceData => {
          Object.keys(deviceData).forEach(mode => allHashModes.add(mode));
        });
        
        // Sort hash modes by ID
        availableHashModes = Array.from(allHashModes).sort((a, b) => {
          const aId = parseInt(a.split(' ')[2]);
          const bId = parseInt(b.split(' ')[2]);
          return aId - bId;
        });
        
        console.log(`Found ${availableHashModes.length} unique hash modes:`, availableHashModes);
        console.log(`Loaded ${Object.keys(benchmarkData).length} devices:`, Object.keys(benchmarkData));
        
        // Initialize search functionality
        initializeHashModeSearch();
        
        // Auto-select and display the first hash mode
        if (availableHashModes.length > 0) {
          const firstHashMode = availableHashModes[0];
          const firstDeviceWithMode = Object.keys(benchmarkData).find(device => 
            benchmarkData[device][firstHashMode]
          );
          const modeName = firstDeviceWithMode ? 
            benchmarkData[firstDeviceWithMode][firstHashMode].hashmode_name : 'Unknown';
          
          // Set the selected hash mode
          selectedHashMode = firstHashMode;
          
          // Update search input to show selected mode
          document.getElementById('hashModeSearch').value = `${firstHashMode} (${modeName})`;
          document.getElementById('clearSearch').style.display = 'block';
          
          // Display the chart for the first hash mode
          updateChart(firstHashMode);
        }
        
        // Hide loading, show main content
        document.getElementById('loading-text').textContent = 
          `Successfully loaded ${Object.keys(benchmarkData).length} devices with ${availableHashModes.length} hash modes`;
        
        setTimeout(() => {
          loadingElement.classList.add('hidden');
          mainContent.classList.remove('hidden');
        }, 1000);
        
      } catch (error) {
        console.error('Error loading benchmark data:', error);
        loadingElement.innerHTML = '<div class="alert alert-error">Failed to load benchmark data. Please check the console for details.</div>';
      }
    }
    
    // Function to create or update chart
    function updateChart(selectedHashMode) {
      if (!selectedHashMode || !benchmarkData) return;
      
      const ctx = document.getElementById('performanceChart').getContext('2d');
      
      // Collect data for the selected hash mode
      const deviceData = [];
      const speeds = [];
      
      Object.entries(benchmarkData).forEach(([deviceName, hashModes]) => {
        if (hashModes[selectedHashMode]) {
          deviceData.push(deviceName);
          speeds.push(hashModes[selectedHashMode].speed);
        }
      });
      
      // Sort by speed (descending)
      const sortedData = deviceData
        .map((device, index) => ({ device, speed: speeds[index] }))
        .sort((a, b) => b.speed - a.speed);
      
      const sortedDevices = sortedData.map(item => item.device);
      const sortedSpeeds = sortedData.map(item => item.speed);
      const sortedLabels = sortedDevices.map(d => shortDeviceLabel(d));
      
      // Calculate dynamic height based on number of devices
      const minHeight = 200; // Minimum height
      const heightPerDevice = 40; // Height per device (in pixels)
      const calculatedHeight = Math.max(minHeight, sortedDevices.length * heightPerDevice);
      
      // Set the chart container height
      const chartContainer = document.getElementById('chartContainer');
      chartContainer.style.height = `${calculatedHeight}px`;
      
      // Destroy existing chart
      if (chart) {
        chart.destroy();
      }
      
      // Create new chart (horizontal bar chart)
      chart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: sortedLabels,
          datasets: [{
            label: 'Speed (H/s)',
            data: sortedSpeeds,
            backgroundColor: 'rgba(54, 162, 235, 0.6)',
            borderColor: 'rgba(54, 162, 235, 1)',
            borderWidth: 1
          }]
        },
        options: {
          indexAxis: 'y', // This makes it horizontal
          responsive: true,
          maintainAspectRatio: false,
          aspectRatio: false, // Disable aspect ratio to use custom height
          scales: {
            x: {
              beginAtZero: true,
              ticks: {
                callback: function(value) {
                  return formatSpeed(value);
                }
              }
            },
            y: {
              ticks: {
                font: {
                  size: 12
                }
              }
            }
          },
          plugins: {
            tooltip: {
              callbacks: {
                title: function(context) {
                  return sortedDevices[context[0].dataIndex];
                },
                label: function(context) {
                  return `${context.dataset.label}: ${formatSpeed(context.parsed.x)}`;
                }
              }
            },
            legend: {
              display: false
            },
            // Add data labels plugin for speed labels
            datalabels: {
              display: true,
              color: '#333',
              font: {
                size: 11,
                weight: 'bold'
              },
              formatter: function(value, context) {
                return formatSpeed(value);
              },
              anchor: 'end',
              align: 'right',
              offset: 5
            }
          }
        }
      });
      
      // Update chart title
      const hashModeInfo = benchmarkData[sortedDevices[0]]?.[selectedHashMode];
      const modeName = hashModeInfo ? hashModeInfo.hashmode_name : 'Unknown';
      document.getElementById('chartTitle').textContent = 
        `GPU Performance Comparison - ${selectedHashMode} (${modeName})`;
    }
    
    // Function to initialize hash mode search functionality
    function initializeHashModeSearch() {
      const searchInput = document.getElementById('hashModeSearch');
      const dropdown = document.getElementById('hashModeDropdown');
      const clearButton = document.getElementById('clearSearch');
      
      // Initialize with all hash modes
      filteredHashModes = [...availableHashModes];
      renderDropdown();
      
      // Search functionality
      searchInput.addEventListener('input', function(e) {
        const query = e.target.value.toLowerCase().trim();
        
        if (query === '') {
          filteredHashModes = [...availableHashModes];
          clearButton.style.display = 'none';
        } else {
          filteredHashModes = availableHashModes.filter(mode => {
            const firstDeviceWithMode = Object.keys(benchmarkData).find(device => 
              benchmarkData[device][mode]
            );
            const modeName = firstDeviceWithMode ? 
              benchmarkData[firstDeviceWithMode][mode].hashmode_name : '';
            return mode.toLowerCase().includes(query) || 
                   modeName.toLowerCase().includes(query);
          });
          clearButton.style.display = 'block';
        }
        
        renderDropdown();
      });
      
      // Clear search
      clearButton.addEventListener('click', function() {
        searchInput.value = '';
        filteredHashModes = [...availableHashModes];
        clearButton.style.display = 'none';
        renderDropdown();
      });
      
      // Hide dropdown when clicking outside
      document.addEventListener('click', function(e) {
        if (!searchInput.contains(e.target) && !dropdown.contains(e.target)) {
          dropdown.style.display = 'none';
        }
      });
      
      // Show dropdown when focusing on input
      searchInput.addEventListener('focus', function() {
        dropdown.style.display = 'block';
      });
    }
    
    // Function to render dropdown options
    function renderDropdown() {
      const dropdown = document.getElementById('hashModeDropdown');
      dropdown.innerHTML = '';
      
      if (filteredHashModes.length === 0) {
        const noResults = document.createElement('div');
        noResults.className = 'p-4 text-center text-gray-500';
        noResults.textContent = 'No hash modes found';
        dropdown.appendChild(noResults);
        return;
      }
      
      filteredHashModes.forEach(mode => {
        const option = document.createElement('div');
        option.className = 'p-3 hover:bg-base-200 cursor-pointer border-b border-base-200 last:border-b-0';
        
        // Get the hash mode name from the first device that has this mode
        const firstDeviceWithMode = Object.keys(benchmarkData).find(device => 
          benchmarkData[device][mode]
        );
        const modeName = firstDeviceWithMode ? 
          benchmarkData[firstDeviceWithMode][mode].hashmode_name : 'Unknown';
        
        option.innerHTML = `
          <div class="font-semibold">${mode}</div>
          <div class="text-sm text-gray-600">${modeName}</div>
        `;
        
        option.addEventListener('click', function() {
          selectHashMode(mode, modeName);
        });
        
        dropdown.appendChild(option);
      });
    }
    
    // Function to select a hash mode
    function selectHashMode(mode, modeName) {
      selectedHashMode = mode;
      const searchInput = document.getElementById('hashModeSearch');
      const dropdown = document.getElementById('hashModeDropdown');
      const clearButton = document.getElementById('clearSearch');
      
      searchInput.value = `${mode} (${modeName})`;
      dropdown.style.display = 'none';
      clearButton.style.display = 'block';
      
      updateChart(mode);
    }
    
    // ---------------------------------------------------------------------------
    // Submit benchmark modal
    // ---------------------------------------------------------------------------
    const submitModal = document.getElementById('submitModal');
    const openSubmitBtn = document.getElementById('openSubmitBtn');
    const cancelSubmitBtn = document.getElementById('cancelSubmitBtn');
    const submitForm = document.getElementById('submitForm');
    const submitBtn = document.getElementById('submitBtn');
    const submitBtnLabel = document.getElementById('submitBtnLabel');
    const submitBtnSpinner = document.getElementById('submitBtnSpinner');
    const submitStatus = document.getElementById('submitStatus');
    const turnstileWidget = document.getElementById('turnstileWidget');

    let turnstileWidgetId = null;

    if (!SUBMIT_CONFIG.workerUrl || !SUBMIT_CONFIG.turnstileSiteKey) {
      // Submission endpoint not fully configured — hide the feature.
      openSubmitBtn.remove();
    } else {
      // Wait for the Turnstile script (loaded async) to be ready.
      function whenTurnstileReady(timeoutMs = 8000) {
        return new Promise((resolve, reject) => {
          const start = performance.now();
          (function check() {
            if (typeof window.turnstile !== 'undefined' && typeof window.turnstile.render === 'function') {
              return resolve(window.turnstile);
            }
            if (performance.now() - start > timeoutMs) {
              return reject(new Error('Turnstile failed to load.'));
            }
            setTimeout(check, 100);
          })();
        });
      }

      function resetTurnstile() {
        if (turnstileWidgetId !== null && typeof window.turnstile !== 'undefined') {
          window.turnstile.reset(turnstileWidgetId);
        }
      }

      openSubmitBtn.addEventListener('click', async () => {
        submitStatus.classList.add('hidden');
        submitModal.showModal();

        // Render (or re-render) the widget once the dialog is visible.
        try {
          const ts = await whenTurnstileReady();
          if (turnstileWidgetId === null) {
            turnstileWidget.innerHTML = '';
            turnstileWidgetId = ts.render(turnstileWidget, {
              sitekey: SUBMIT_CONFIG.turnstileSiteKey,
              theme: document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light',
              callback: () => { /* token obtained; submit happens on button click */ },
              'error-callback': () => showStatus('error', 'Captcha error. Please refresh and try again.')
            });
          } else {
            ts.reset(turnstileWidgetId);
          }
        } catch (err) {
          showStatus('error', err.message || 'Captcha failed to load.');
        }
      });

      cancelSubmitBtn.addEventListener('click', () => submitModal.close());

      submitForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const content = document.getElementById('submitContent').value;

        if (turnstileWidgetId === null || typeof window.turnstile === 'undefined') {
          showStatus('error', 'Captcha not ready yet, please wait a moment.');
          return;
        }
        const turnstileToken = window.turnstile.getResponse(turnstileWidgetId);
        if (!turnstileToken) {
          showStatus('error', 'Please complete the captcha.');
          return;
        }

        setSubmitting(true);
        showStatus('info', 'Submitting to GitHub...');

        try {
          const resp = await fetch(SUBMIT_CONFIG.workerUrl + '/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content, turnstileToken })
          });
          const data = await resp.json().catch(() => ({}));

          if (resp.ok && data.success) {
            const commitUrl = data.commit?.url;
            const commitLink = commitUrl
              ? `<a href="${commitUrl}" target="_blank" rel="noopener" class="link link-hover font-medium">View commit</a>`
              : '';
            showStatus(
              'success',
              `<div class="flex flex-col gap-1 text-left w-full min-w-0">
                <p class="font-semibold">Committed successfully</p>
                <p class="text-sm opacity-80 break-all"><code class="text-xs">${data.filename}</code> added to the repository.${commitLink ? ' ' + commitLink : ''}</p>
                <p class="text-xs opacity-70">Charts will refresh after the data regeneration workflow finishes.</p>
              </div>`
            );
            submitForm.reset();
            resetTurnstile();
          } else {
            showStatus('error', data.error || `Submission failed (HTTP ${resp.status}).`);
            resetTurnstile();
          }
        } catch (err) {
          console.error(err);
          showStatus('error', 'Network error: could not reach the submission service.');
        } finally {
          setSubmitting(false);
        }
      });
    }

    function setSubmitting(busy) {
      submitBtn.disabled = busy;
      submitBtnSpinner.classList.toggle('hidden', !busy);
      submitBtnLabel.textContent = busy ? 'Submitting...' : 'Submit';
    }

    function showStatus(kind, html) {
      submitStatus.classList.remove('hidden', 'alert-info', 'alert-success', 'alert-error');
      submitStatus.classList.add(
        'items-start',
        kind === 'success' ? 'alert-success' :
        kind === 'error' ? 'alert-error' : 'alert-info'
      );
      submitStatus.innerHTML = html;
    }

    // Initialize the application
    document.addEventListener('DOMContentLoaded', function() {
      loadAllBenchmarkData();
    });
  </script>
</body>
</html>
